version: "3.9"

# Docker Compose tự động đọc file .env ở cùng thư mục (root)

services:
  postgres-identity:
    image: postgres:16-alpine
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB:-identity_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    networks:
      - identity-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${IDENTITY_DB:-identity_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:16-alpine
    container_name: catalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB:-catalog_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    networks:
      - catalog-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${CATALOG_DB:-catalog_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:16-alpine
    container_name: order-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORDER_DB:-order_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${ORDER_DB_PORT:-5435}:5432"
    volumes:
      - order_pgdata:/var/lib/postgresql/data
    networks:
      - order-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d ${ORDER_DB:-order_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAYMENT_DB:-payment_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${PAYMENT_DB_PORT:-5436}:5432"
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
    networks:
      - payment-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${PAYMENT_DB:-payment_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-job:
    image: postgres:16-alpine
    container_name: job-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JOB_DB:-job_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or the environment}
    ports:
      - "${JOB_DB_PORT:-5437}:5432"
    volumes:
      - job_pgdata:/var/lib/postgresql/data
    networks:
      - job-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${JOB_DB:-job_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-communication:
    image: mongo:7.0
    container_name: communication-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${COMMUNICATION_DB_PORT:-27017}:27017"
    volumes:
      - communication_mongodata:/data/db
    networks:
      - communication-net
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - localhost:27017
        - --eval
        - >-
          try { rs.status(); }
          catch (e) {
            if (e.code !== 94) throw e;
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]});
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  communication_mongodata:
    driver: local
  identity_pgdata:
    driver: local
  catalog_pgdata:
    driver: local
  order_pgdata:
    driver: local
  payment_pgdata:
    driver: local
  job_pgdata:
    driver: local

networks:
  communication-net:
    driver: bridge
  identity-net:
    driver: bridge
  catalog-net:
    driver: bridge
  order-net:
    driver: bridge
  payment-net:
    driver: bridge
  job-net:
    driver: bridge
