server:
  port: ${TRUST_PORT:8087}
  servlet:
    context-path: /trust

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: trust-service
  datasource:
    url: jdbc:postgresql://localhost:${TRUST_DB_PORT:5438}/${TRUST_DB:trust_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  storage:
    type: ${TRUST_STORAGE_TYPE:local}
    s3:
      endpoint: ${TRUST_S3_ENDPOINT:https://s3.amazonaws.com}
      bucket: ${TRUST_S3_BUCKET:}
      region: ${TRUST_S3_REGION:ap-southeast-1}
      access-key: ${TRUST_S3_ACCESS_KEY:}
      secret-key: ${TRUST_S3_SECRET_KEY:}
      prefix: trust
    local-dir: ${TRUST_STORAGE_LOCAL_DIR:./.workgo-storage/trust}
    signing-key: ${TRUST_STORAGE_SIGNING_KEY:}
    public-base-url: ${TRUST_STORAGE_PUBLIC_BASE_URL:/api/v1/trust}
  decisions:
    execution-enabled: ${TRUST_DECISION_EXECUTION_ENABLED:false}
  internal-api-key: ${INTERNAL_API_KEY:}
  review:
    window-days: ${TRUST_REVIEW_WINDOW_DAYS:14}
    publication-cron: ${TRUST_REVIEW_PUBLICATION_CRON:0 */5 * * * *}
  outbox:
    poll-interval-ms: ${TRUST_OUTBOX_POLL_MS:5000}
    max-attempts: ${TRUST_OUTBOX_MAX_ATTEMPTS:5}
    lease-seconds: ${TRUST_OUTBOX_LEASE_SECONDS:60}
  dispute:
    window-days: ${TRUST_DISPUTE_WINDOW_DAYS:14}
  clients:
    connect-timeout-millis: ${TRUST_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${TRUST_CLIENT_READ_TIMEOUT_MS:5000}
  services:
    identity: ${IDENTITY_SERVICE_URL:http://localhost:8081/identity}
    catalog: ${CATALOG_SERVICE_URL:http://localhost:8082/catalog}
    order: ${ORDER_SERVICE_URL:http://localhost:8083/order}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8084/payment}
    job: ${JOB_SERVICE_URL:http://localhost:8085/job}
    communication: ${COMMUNICATION_SERVICE_URL:http://localhost:8086/communication}

---
# Preserve schema validation profile in the single application config file.
spring:
  config:
    activate:
      on-profile: validated
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
