server:
  port: ${JOB_PORT:8085}
  servlet:
    context-path: /job

spring:
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://localhost:${JOB_DB_PORT:5437}/${JOB_DB:job_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  storage:
    type: ${JOB_STORAGE_TYPE:local}
    s3:
      endpoint: ${JOB_S3_ENDPOINT:https://s3.amazonaws.com}
      bucket: ${JOB_S3_BUCKET:}
      region: ${JOB_S3_REGION:ap-southeast-1}
      access-key: ${JOB_S3_ACCESS_KEY:}
      secret-key: ${JOB_S3_SECRET_KEY:}
      prefix: job
    local-dir: ${JOB_STORAGE_DIR:./.workgo-storage/job}
    signing-key: ${JOB_STORAGE_SIGNING_KEY:}
  outbox:
    scheduling-enabled: ${JOB_OUTBOX_ENABLED:true}
    max-attempts: ${JOB_OUTBOX_MAX_ATTEMPTS:5}
    lease-seconds: ${JOB_OUTBOX_LEASE_SECONDS:60}
    poll-delay-ms: ${JOB_OUTBOX_POLL_DELAY_MS:5000}
  proposals:
    reward-quote-required: ${JOB_REWARD_QUOTE_REQUIRED:true}
    # Enable only after deploying the step-5 DIGITAL/idempotency/internal-key contracts.
    accept-enabled: ${JOB_PROPOSAL_ACCEPT_ENABLED:false}
  internal-api-key: ${INTERNAL_API_KEY:}
  clients:
    connect-timeout-millis: ${JOB_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${JOB_CLIENT_READ_TIMEOUT_MS:5000}
  services:
    identity: ${IDENTITY_SERVICE_URL:http://localhost:8081/identity}
    catalog: ${CATALOG_SERVICE_URL:http://localhost:8082/catalog}
    order: ${ORDER_SERVICE_URL:http://localhost:8083/order}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8084/payment}

---
# Preserve schema validation profile in the single application config file.
spring:
  config:
    activate:
      on-profile: validated
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
