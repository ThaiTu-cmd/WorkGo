server:
  port: ${CATALOG_PORT:8082}
  servlet:
    context-path: /catalog

spring:
  application:
    name: catalog-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: jdbc:postgresql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:5434}/${CATALOG_DB:catalog_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  internal-key: ${INTERNAL_API_KEY:}
  storage:
    signing-key: ${CATALOG_STORAGE_SIGNING_KEY:}
    type: ${CATALOG_STORAGE_TYPE:local}
    s3:
      endpoint: ${CATALOG_S3_ENDPOINT:https://s3.amazonaws.com}
      bucket: ${CATALOG_S3_BUCKET:}
      region: ${CATALOG_S3_REGION:ap-southeast-1}
      access-key: ${CATALOG_S3_ACCESS_KEY:}
      secret-key: ${CATALOG_S3_SECRET_KEY:}
      prefix: catalog
    local-dir: ${CATALOG_STORAGE_DIR:${user.home}/.workgo/catalog-files}
  service:
    identity:
      url: ${APP_SERVICE_IDENTITY_URL:${IDENTITY_SERVICE_URL:http://localhost:8081/identity}}