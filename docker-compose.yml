version: "3.9"

# Docker Compose tự động đọc file .env ở cùng thư mục (root)

services:
  postgres-identity:
    image: postgres:16-alpine
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_DB:-identity_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${IDENTITY_DB_PORT:-5432}:5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    networks:
      - identity-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${IDENTITY_DB:-identity_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:16-alpine
    container_name: catalog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB:-catalog_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    networks:
      - catalog-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${CATALOG_DB:-catalog_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  identity_pgdata:
    driver: local
  catalog_pgdata:
    driver: local

networks:
  identity-net:
    driver: bridge
  catalog-net:
    driver: bridge
