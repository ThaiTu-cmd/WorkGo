server:
  address: ${COMMUNICATION_BIND_ADDRESS:127.0.0.1}
  port: ${COMMUNICATION_PORT:8086}
  servlet:
    context-path: /communication

spring:
  application:
    name: communication-service
  data:
    mongodb:
      uri: ${COMMUNICATION_MONGODB_URI:mongodb://localhost:${COMMUNICATION_DB_PORT:27017}/${COMMUNICATION_DB:communication_db}?replicaSet=rs0&directConnection=true}
      auto-index-creation: ${COMMUNICATION_AUTO_INDEX_CREATION:false}

app:
  internal-api-key: ${INTERNAL_API_KEY:}
  websocket:
    allowed-origins: ${COMMUNICATION_WS_ALLOWED_ORIGINS:http://localhost:5173}
    connect-timeout-ms: ${COMMUNICATION_WS_CONNECT_TIMEOUT_MS:10000}
    heartbeat-ms: ${COMMUNICATION_WS_HEARTBEAT_MS:10000}
    revalidate-interval-ms: ${COMMUNICATION_WS_REVALIDATE_INTERVAL_MS:60000}
    maintenance-interval-ms: ${COMMUNICATION_WS_MAINTENANCE_INTERVAL_MS:1000}
    validation-timeout-ms: ${COMMUNICATION_WS_VALIDATION_TIMEOUT_MS:8000}
    validation-threads: ${COMMUNICATION_WS_VALIDATION_THREADS:4}
    validation-queue-capacity: ${COMMUNICATION_WS_VALIDATION_QUEUE_CAPACITY:100}
    max-pending-handshakes: ${COMMUNICATION_WS_MAX_PENDING_HANDSHAKES:100}
    max-sessions: ${COMMUNICATION_WS_MAX_SESSIONS:1000}
    max-subscriptions: ${COMMUNICATION_WS_MAX_SUBSCRIPTIONS:100}
    message-size-limit: ${COMMUNICATION_WS_MESSAGE_SIZE_LIMIT:65536}
  attachments:
    max-count-per-message: ${COMMUNICATION_MAX_ATTACHMENTS:10}
    max-file-size-bytes: ${COMMUNICATION_MAX_FILE_SIZE_BYTES:20971520}
    max-total-size-bytes: ${COMMUNICATION_MAX_TOTAL_SIZE_BYTES:104857600}
  clients:
    connect-timeout-millis: ${COMMUNICATION_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${COMMUNICATION_CLIENT_READ_TIMEOUT_MS:5000}
  services:
    identity: ${IDENTITY_SERVICE_URL:http://localhost:8081/identity}
    catalog: ${CATALOG_SERVICE_URL:http://localhost:8082/catalog}
    order: ${ORDER_SERVICE_URL:http://localhost:8083/order}
    job: ${JOB_SERVICE_URL:http://localhost:8085/job}
