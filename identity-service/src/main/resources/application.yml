server:
  port: ${IDENTITY_PORT:8081}
  servlet:
    context-path: /identity

spring:
  application:
    name: identity-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://${IDENTITY_DB_HOST:localhost}:${IDENTITY_DB_PORT:5433}/${IDENTITY_DB:identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  services:
    job: ${JOB_SERVICE_URL:http://localhost:8085/job}
    catalog: ${CATALOG_SERVICE_URL:http://localhost:8082/catalog}
    trust: ${TRUST_SERVICE_URL:http://localhost:8087/trust}
    order: ${ORDER_SERVICE_URL:http://localhost:8083/order}
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8084/payment}
  internal-api-key: ${INTERNAL_API_KEY:}
  storage:
    type: ${IDENTITY_STORAGE_TYPE:local}
    s3:
      endpoint: ${IDENTITY_S3_ENDPOINT:https://s3.amazonaws.com}
      bucket: ${IDENTITY_S3_BUCKET:}
      region: ${IDENTITY_S3_REGION:ap-southeast-1}
      access-key: ${IDENTITY_S3_ACCESS_KEY:}
      secret-key: ${IDENTITY_S3_SECRET_KEY:}
      prefix: identity
    local-dir: ${IDENTITY_STORAGE_DIR:${user.home}/.workgo/identity-files}
    signing-key: ${IDENTITY_STORAGE_SIGNING_KEY:${IDENTITY_FILE_SIGNING_KEY:}}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    user-name: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
