server:
  port: ${JOB_PORT:8082}
  servlet:
    context-path: /job

spring:
  application:
    name: job-service
  datasource:
    url: jdbc:postgresql://localhost:5433/${JOB_DB:job_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

jwt:
  signerKey: ${JWT_SIGNER_KEY}
