server:
  port: ${IDENTITY_PORT:8081}
  servlet:
    context-path: /identity

spring:
  application:
    name: identity-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:postgresql://localhost:5433/${IDENTITY_DB:identity_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  internal-api-key: ${INTERNAL_API_KEY:}
  storage:
    local-dir: ${IDENTITY_STORAGE_DIR:${user.home}/.workgo/identity-files}
    signing-key: ${IDENTITY_FILE_SIGNING_KEY:}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    user-name: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
